version: '3.8'

services:
  whiteboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excalidraw-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - whiteboard-data:/app/data

volumes:
  whiteboard-data:
    driver: local

